{% extends "base.html" %}

{% block head %}
<title>Update {{ task.content }}</title>
{% endblock %}

{% block body %}
<div class="content">
    <div class="title">
        <h1 style="text-align: center"><a href = "{{ url_for('index') }}">Task Master</a></h1>
    </div>
    </form>
        <form action="/update/{{task.id}}" method="POST">
        <div class="row" style="margin-top: 40px;">
    <input type="text" name="content" id="content" value="{{ task.content }}">

    <select name="priority">

        <option value="1" {% if task.priority == 1 %}selected{% endif %}>High</option>
        <option value="2" {% if task.priority == 2 %}selected{% endif %}>Regular</option>
        <option value="3" {% if task.priority == 3 %}selected{% endif %}>Low</option>
    </select>
            </div>
    <div class="row actions">
            <button type="submit" class="link-button">Update</button>
        </div>
</form>
</div>
{% endblock %}
