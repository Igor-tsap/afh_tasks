{% extends "base.html" %}

{% block head %}
<title>Page {{ num }}</title>
{% endblock %}

{% block body %}
{%- for message in get_flashed_messages() %}
    <div class="flash {{ category }}">
        {{ message }}
    </div>
{%- endfor %}

<div class="box">{{ num }} is the coolest number in the world!</div>
{% endblock %}
