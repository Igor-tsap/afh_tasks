{% extends "base.html" %}

{% block head %}
<title>Cool Guys Club</title>
{% endblock %}

{% block body %}

{%- for message in get_flashed_messages() %}
    <div class="flash {{ category }}">
        {{ message }}
    </div>
{%- endfor %}

<div class="box">
<table>
    {% for key,value in my_dict.items() %}
    <tr>
        <td>{{ key }}</td>
        <td>{{ value }}</td>
    </tr>
    {% endfor %}
</table>
    <form action="/" method="POST">
        <div class = "">
            <input style="" type="text" name="fname" placeholder="first name"><input type="text" name="sname" placeholder="second name">
        </div>
        <button type="submit" class="link-button">Submit</button>
    </form>
    <form action="/" method="POST">
        <input type="hidden" name="fake_method" value="PUT">
        <div class="">
            <input style="" type="text" name="put_fname" placeholder="first name"><input type="text" name="put_sname" placeholder="second name">
        </div>
        <button type="submit" class="link-button">Replace All</button>
    </form>
</div>



{% endblock %}
