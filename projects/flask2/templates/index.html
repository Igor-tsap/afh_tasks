{% extends "base.html" %}

{% block head %}
<title>Cool Guys Club</title>
{% endblock %}

{% block body %}
<header>
    <h1>Cool Guys Club</h1>
    {% for number in my_list %}
    <a href="/{{ number }}>">{{ number }}</a>
    {% endfor %}
</header>

<div class="box">
<table>
    {% for key,value in my_dict.items() %}
    <tr>
        <td>{{ key }}</td>
        <td>{{ value }}</td>
    </tr>
    {% endfor %}
</table>
</div>



{% endblock %}
