{% extends "base.html" %}

{% block head %}
<title>Cool Guys Club</title>
{% endblock %}

{% block body %}

{%- for message in get_flashed_messages() %}
    <div class="flash {{ category }}">
        {{ message }}
    </div>
{%- endfor %}

<div class="box">
<table>
    {% for key,value in my_dict.items() %}
    <tr>
        <td>{{ key }}</td>
        <td>{{ value }}</td>
    </tr>
    {% endfor %}
</table>
    <form action="/" method="POST">
        <div class = "row">
            <input style="" type="text" name="adj" placeholder="adjective"><input type="text" name="name" placeholder="name">
        </div>
        <button type="submit" class="link-button">Add Row</button>
    </form>
</div>



{% endblock %}
