{% extends "base.html" %}

{% block head %}
<head>
    <title>admin_page</title>
</head>
{% endblock %}
{% block body %}
<body>

    <p></p>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
           {% for message in messages %}
                <div class="flash {{ category }}">
                    {{ message }}
                </div>
           {% endfor %}
        {% endif %}
    {% endwith %}
    <h1>Hello {{ name }}!</h1>

    <a href = "http://localhost:5000/upload" style="">upload file</a>

</body>
{% endblock %}
