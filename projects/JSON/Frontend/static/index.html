<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Animals</title>

    <link rel="stylesheet" href="css/styles.css">


</head>
<body>

    <h1>Animals</h1>


<section id="create-animal-section">

    <form id="create-animal-form" class="form-panel">
        <h3>Create New Animal</h3>
        <label>Name:<br>
            <input type="text" name="name" required>
        </label>
        <label>Price:<br>
            <input type="number" name="price" required>
        </label>
        <label>Quantity:<br>
            <input type="number" name="quantity" required>
        </label>
        <label>Image URL:<br>
            <input type="text" name="img" placeholder="https://example.com/cat.jpg">
        </label>

        <button type="submit">Add Animal</button>
        <p id="create-status"></p>
    </form>
</section>

<section id="animals-list" class="animal-list">Loading...</section>



    <script src="js/api.js"></script>
    <script src="js/animals.js"></script>
</body>
</html>
