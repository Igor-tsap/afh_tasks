{% extends "base.html" %}
{% block head %}

{% endblock %}
{% block body %}
<div class="box">
<h1> DATA FOR QUANTITY {{ quantity }}</h1>

    <tr>
        <th>id</th>
        <th>name</th>
        <th>$</th>
        <th>q</th>
    </tr>
    </thead>
    <tbody>
    {% for row in data%}

        <td>{{row[0]}}</td>
        <td>{{row[1]}}</td>
        <td>{{row[2]}}</td>
        <td>{{row[3]}}</td>
    </tr>
    {% endfor %}
    </tbody>
</table>
</div>
{% endblock %}
